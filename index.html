<meta name="theme-color" content="#0D1B2A">
<style>
:root { --gold:#FFD700; --dark:#0D1B2A; --accent:#C8102E; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body { background:var(--dark); color:#fff; font-family:'Helvetica Neue',Arial,sans-serif; }

.stars-bg {
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 8% 7%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 23% 15%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.5px 1.5px at 39% 5%,rgba(255,255,255,.60),transparent),
    radial-gradient(1px 1px at 54% 21%,rgba(255,255,255,.40),transparent),
    radial-gradient(1px 1px at 69% 10%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.5px 1.5px at 85% 18%,rgba(255,255,255,.65),transparent),
    radial-gradient(1px 1px at 95% 34%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 5% 42%,rgba(255,255,255,.50),transparent),
    radial-gradient(1px 1px at 18% 55%,rgba(255,255,255,.40),transparent),
    radial-gradient(1px 1px at 32% 48%,rgba(255,255,255,.50),transparent),
    radial-gradient(1.5px 1.5px at 48% 62%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 63% 70%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 78% 58%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 90% 75%,rgba(255,255,255,.60),transparent),
    radial-gradient(1px 1px at 12% 82%,rgba(255,255,255,.50),transparent),
    radial-gradient(1px 1px at 35% 88%,rgba(255,255,255,.40),transparent),
    radial-gradient(1.5px 1.5px at 60% 92%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 75% 85%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,.30),transparent),
    radial-gradient(1px 1px at 22% 30%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 44% 73%,rgba(255,255,255,.38),transparent),
    radial-gradient(1px 1px at 87% 43%,rgba(255,255,255,.42),transparent),
    radial-gradient(1.5px 1.5px at 4% 69%,rgba(255,255,255,.48),transparent),
    radial-gradient(1px 1px at 67% 39%,rgba(255,255,255,.32),transparent);
}

/* ═══════════════ TOC ═══════════════ */
#page-toc {
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column;
  transition:transform .35s ease, opacity .35s ease;
}
#page-toc.hidden { transform:translateY(-100%); opacity:0; pointer-events:none; }

.toc-header {
  padding:18px 20px 8px; text-align:center; flex-shrink:0;
  background:linear-gradient(180deg,rgba(13,27,42,.97) 65%,transparent);
}
.toc-logo  { font-size:8px; letter-spacing:6px; color:rgba(200,16,46,.38); margin-bottom:6px; }
.toc-title {
  font-size:20px; font-weight:900; letter-spacing:3px;
  background:linear-gradient(135deg,var(--accent),#fff 55%,var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:3px;
}
.toc-sub { font-size:8px; color:#2e3e52; letter-spacing:4px; }

.week-filter {
  display:flex; gap:6px; padding:8px 12px 6px;
  flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.week-filter::-webkit-scrollbar { display:none; }
.wf-btn {
  flex-shrink:0; padding:5px 12px; border-radius:14px; font-size:9px; font-weight:700;
  letter-spacing:1px; cursor:pointer; border:1px solid rgba(255,255,255,.08);
  color:#444; background:transparent; transition:all .2s; white-space:nowrap;
}
.wf-btn.active { background:rgba(200,16,46,.12); border-color:#C8102E66; color:#C8102E; }

.toc-scroll { flex:1; overflow-y:auto; padding:6px 12px 24px; -webkit-overflow-scrolling:touch; }

.toc-week-header {
  font-size:8px; font-weight:700; letter-spacing:3px; color:#333;
  padding:12px 4px 6px; text-transform:uppercase;
}
.toc-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.toc-item {
  background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.065);
  border-radius:12px; padding:12px 11px 10px; cursor:pointer;
  transition:all .18s; display:flex; flex-direction:column; gap:2px;
  position:relative; overflow:hidden;
}
.toc-item::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,var(--c,transparent) 0%,transparent 68%);
  opacity:.055; pointer-events:none;
}
.toc-item:active { transform:scale(.96); }
.toc-day     { font-size:8px; font-weight:700; letter-spacing:2px; color:var(--c,#C8102E); }
.toc-word    { font-size:19px; font-weight:900; color:#fff; line-height:1.1; }
.toc-meaning { font-size:11px; color:#555; margin-top:1px; }
.toc-tag-sm  { font-size:8px; color:#2a2a44; margin-top:2px; line-height:1.3; }

/* ═══════════════ FLASHCARD ═══════════════ */
#page-card {
  position:fixed; inset:0; z-index:10;
  display:flex; flex-direction:column;
  transition:transform .35s ease, opacity .35s ease; overflow:hidden;
}
#page-card.hidden { transform:translateY(100%); opacity:0; pointer-events:none; }

.card-topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 20px 8px; flex-shrink:0; z-index:2; position:relative;
}
.back-btn {
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
  color:#777; font-size:10px; padding:7px 15px; border-radius:20px;
  cursor:pointer; letter-spacing:1.5px; transition:all .2s;
}
.back-btn:active { background:rgba(255,255,255,.14); color:#ccc; }
.card-day-badge {
  font-size:9px; font-weight:700; letter-spacing:4px;
  padding:5px 16px; border-radius:14px; border:1px solid;
}
.speak-btn {
  width:42px; height:42px; border-radius:50%;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
  color:#777; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.speak-btn:active { border-color:var(--accent); color:var(--accent); background:rgba(200,16,46,.15); }

.card-main {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:2; text-align:center;
  user-select:none; cursor:pointer;
  position:relative; overflow:hidden;
  padding:0 32px;
}
.card-scene  { position:absolute; inset:0; pointer-events:none; z-index:0; transition:background-image .4s ease; }
.card-emoji  {
  position:absolute; pointer-events:none; z-index:1; bottom:6%; right:-1%;
  font-size:clamp(110px,30vw,155px); line-height:1; opacity:0.06;
  transform:rotate(-10deg); transition:opacity .3s; user-select:none;
}
.card-main.ex-open .card-emoji { opacity:0.028; }

.word-section {
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none; position:relative; z-index:2;
  transition:transform .35s ease;
}
.card-main.ex-open .word-section { transform:translateY(-16px); }

.card-cat {
  font-size:8px; font-weight:700; letter-spacing:4px;
  margin-bottom:14px; opacity:.55; text-transform:uppercase;
}
.card-word {
  font-size:clamp(52px,15vw,96px); font-weight:900;
  line-height:1.02; letter-spacing:2px; margin-bottom:12px;
}
.card-phonetics { display:flex; align-items:center; gap:8px; margin-bottom:20px; }
.pho-stress { font-size:15px; color:var(--accent); letter-spacing:2px; font-style:italic; }
.pho-sep    { font-size:11px; color:rgba(255,255,255,.12); }
.pho-kana   { font-size:14px; color:rgba(255,255,255,.52); letter-spacing:2px; }
.card-line  { width:52px; height:1.5px; border-radius:1px; margin-bottom:18px; }
.card-meaning { font-size:28px; font-weight:700; letter-spacing:2px; }
.tap-hint {
  font-size:8px; color:rgba(255,255,255,.15); letter-spacing:4px; margin-top:18px;
  transition:opacity .3s;
}
.card-main.ex-open .tap-hint { opacity:0; }

/* ── Example bottom sheet ── */
.ex-panel {
  position:absolute; bottom:0; left:0; right:0;
  background:rgba(13,27,42,0.97); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.09);
  border-radius:22px 22px 0 0;
  padding:6px 24px 22px;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(0.32,0.72,0,1);
  z-index:5; cursor:default;
  overflow-y:auto; max-height:72vh;
}
.ex-panel.show { transform:translateY(0); }
.ex-handle   { width:34px; height:3px; background:rgba(255,255,255,.12); border-radius:2px; margin:0 auto 14px; }
.ex-tag-row  { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.ex-tag      { font-size:8px; font-weight:700; letter-spacing:3px; }
.ex-speak-btn {
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
  color:#777; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0;
}
.ex-speak-btn:active  { border-color:var(--accent); color:var(--accent); background:rgba(200,16,46,.18); }
.ex-speak-btn.playing { border-color:var(--accent); color:var(--accent); background:rgba(200,16,46,.12); }
.ex-zh   { font-size:16px; font-weight:600; color:#e4e4e4; line-height:1.5; margin-bottom:4px; }
.ex-kana { font-size:11px; color:rgba(200,16,46,.80); letter-spacing:.8px; margin-bottom:8px; font-style:italic;
           border-left:2px solid rgba(200,16,46,.30); padding:2px 8px;
           background:rgba(200,16,46,.06); border-radius:0 4px 4px 0; line-height:1.6; }
.ex-jp   { font-size:13px; color:#666; margin-bottom:12px; line-height:1.4; }
.ex-hr   { height:1px; background:rgba(255,255,255,.06); margin-bottom:10px; }
.ex-naze-tag { font-size:8px; font-weight:700; letter-spacing:2px; color:var(--gold); margin-bottom:6px; }
.ex-naze { font-size:12px; color:#888; line-height:1.7; margin-bottom:10px; }
.ex-x-tag { font-size:8px; font-weight:700; letter-spacing:2px; color:#444; margin-bottom:4px; margin-top:4px; }
.ex-x    { font-size:10px; color:#333; line-height:1.6; }

/* ── Bottom nav ── */
.card-bottom {
  flex-shrink:0; padding:10px 24px 26px;
  display:flex; flex-direction:column; gap:12px;
  align-items:center; z-index:2;
}
.card-counter { font-size:9px; color:#333; letter-spacing:4px; }
.card-nav     { display:flex; align-items:center; gap:20px; }
.nav-btn {
  width:54px; height:54px; border-radius:50%;
  border:1px solid rgba(255,255,255,.09); background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.55); font-size:26px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s; line-height:1;
}
.nav-btn:active   { background:rgba(255,255,255,.13); color:#fff; }
.nav-btn:disabled { opacity:.14; cursor:default; }
.progress-bar  { width:100%; height:2px; background:rgba(255,255,255,.06); border-radius:1px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .3s ease; }

.card-main.fx-l { animation:fxL .28s ease forwards; }
.card-main.fx-r { animation:fxR .28s ease forwards; }
@keyframes fxL { 0%{opacity:1;transform:none} 38%{opacity:0;transform:translateX(-26px)} 39%{opacity:0;transform:translateX(26px)} 100%{opacity:1;transform:none} }
@keyframes fxR { 0%{opacity:1;transform:none} 38%{opacity:0;transform:translateX(26px)} 39%{opacity:0;transform:translateX(-26px)} 100%{opacity:1;transform:none} }

/* ── Learned button ── */
.learned-btn {
  display:flex; align-items:center; gap:6px;
  padding:8px 20px; border-radius:20px; border:1.5px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.36);
  font-size:11px; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all .25s;
}
.learned-btn.done { border-color:#32c87a; color:#32c87a; background:rgba(50,200,122,.12); }
.learned-btn:active { transform:scale(.94); }
.toc-item.learned { opacity:.6; }
.toc-item.learned .toc-day::after { content:' ✓'; color:#32c87a; }
.learned-stats { font-size:9px; color:#555; letter-spacing:2px; margin-top:4px; }

/* ── Mascot ── */
.mascot-widget {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07);
  border-radius:14px; padding:8px 14px; margin:8px 16px 0;
  cursor:pointer; transition:background .2s;
}
.mascot-widget:active { background:rgba(255,255,255,.06); }
.mascot-face { font-size:32px; line-height:1; }
.mascot-info { flex:1; }
.mascot-name { font-size:10px; font-weight:800; letter-spacing:2px; color:#fff; }
.mascot-lv   { font-size:8px; color:#555; letter-spacing:1px; margin-top:2px; }
.mascot-bar  { height:3px; background:rgba(255,255,255,.06); border-radius:2px; margin-top:6px; overflow:hidden; }
.mascot-bar-fill { height:100%; border-radius:2px; transition:width .8s ease; background:linear-gradient(90deg,var(--accent),var(--gold)); }
.mascot-pct  { font-size:8px; color:var(--accent); font-weight:700; letter-spacing:1px; }
@keyframes mascotPop { 0%{transform:scale(1)} 40%{transform:scale(1.28)} 100%{transform:scale(1)} }
.mascot-face.pop { animation:mascotPop .4s ease; }

/* ── Quiz button ── */
.quiz-btn {
  margin:8px 16px 0; padding:10px 0; border-radius:12px;
  background:linear-gradient(135deg,rgba(200,16,46,.18),rgba(255,215,0,.12));
  border:1px solid rgba(200,16,46,.28); color:#f08090;
  font-size:10px; font-weight:800; letter-spacing:3px; cursor:pointer; transition:all .22s;
  width:calc(100% - 32px);
}
.quiz-btn:active { background:rgba(200,16,46,.28); }

/* ── Quiz overlay ── */
.quiz-overlay {
  position:fixed; inset:0; background:#0D1B2A; z-index:100;
  display:flex; flex-direction:column; align-items:center;
}
.quiz-overlay.hidden { display:none; }
.quiz-topbar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid rgba(255,255,255,.06);
}
.quiz-close { background:none; border:none; color:#444; font-size:22px; cursor:pointer; padding:4px 10px; }
.quiz-progress-text { font-size:9px; color:#444; letter-spacing:3px; }
.quiz-score-badge { font-size:9px; color:#32c87a; letter-spacing:2px; font-weight:700; }
.quiz-card-area {
  flex:1; width:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:24px 20px; gap:18px;
}
.quiz-word {
  font-size:clamp(52px,15vw,88px); font-weight:900; color:#fff;
  text-align:center; letter-spacing:2px; line-height:1.1;
}
.quiz-kana { font-size:14px; color:#666; letter-spacing:3px; }
.quiz-meaning {
  font-size:26px; font-weight:700; color:var(--accent);
  min-height:36px; transition:opacity .25s;
}
.quiz-meaning.hidden-val { opacity:0; pointer-events:none; }
.quiz-tap-hint { font-size:9px; color:#333; letter-spacing:4px; }
.quiz-btns {
  width:100%; display:flex; gap:14px; padding:0 20px 32px;
  justify-content:center;
}
.quiz-btn-learned {
  flex:1; padding:14px 0; border-radius:14px;
  background:rgba(50,200,122,.14); border:1.5px solid #32c87a;
  color:#32c87a; font-size:12px; font-weight:800; letter-spacing:2px;
  cursor:pointer; transition:all .2s;
}
.quiz-btn-learned:active { background:rgba(50,200,122,.26); transform:scale(.97); }
.quiz-btn-skip {
  flex:1; padding:14px 0; border-radius:14px;
  background:rgba(255,255,255,.04); border:1.5px solid rgba(255,255,255,.10);
  color:#555; font-size:12px; font-weight:800; letter-spacing:2px;
  cursor:pointer; transition:all .2s;
}
.quiz-btn-skip:active { background:rgba(255,255,255,.09); transform:scale(.97); }
.quiz-result {
  width:100%; flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; padding:24px;
}
.quiz-result.hidden { display:none; }
.quiz-result-emoji { font-size:64px; }
.quiz-result-title { font-size:20px; font-weight:800; color:#fff; }
.quiz-result-sub   { font-size:13px; color:#555; line-height:1.6; text-align:center; }
.quiz-result-btn {
  margin-top:10px; padding:12px 32px; border-radius:14px;
  background:rgba(200,16,46,.14); border:1.5px solid var(--accent);
  color:var(--accent); font-size:11px; font-weight:800; letter-spacing:3px;
  cursor:pointer; transition:all .2s;
}
.quiz-result-btn:active { background:rgba(200,16,46,.26); }
.quiz-bar { width:100%; height:3px; background:rgba(255,255,255,.06); }
.quiz-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),#32c87a); transition:width .4s; }

/* ── Theme toggle ── */
.theme-toggle {
  position:fixed; top:14px; right:70px; z-index:300;
  width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.10);
  color:#667; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; -webkit-tap-highlight-color:transparent;
}
.theme-toggle:active { transform:scale(.9); }

/* ══════════════ LIGHT MODE ══════════════ */
[data-theme="light"] body { background:#F0F4FF; color:#0a1628; }
[data-theme="light"] .stars-bg { opacity:0; }
[data-theme="light"] body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 600px 300px at 20% 10%, rgba(200,16,46,.06), transparent),
    radial-gradient(ellipse 400px 400px at 85% 85%, rgba(200,16,46,.04), transparent);
}
[data-theme="light"] #page-toc { background:#F0F4FF; }
[data-theme="light"] .toc-header { background:linear-gradient(180deg,rgba(240,244,255,.97) 60%,transparent); }
[data-theme="light"] .toc-logo { color:rgba(10,22,40,.22); }
[data-theme="light"] .toc-title { background:linear-gradient(135deg,#C8102E,#0a1628 55%,#C8102E); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
[data-theme="light"] .toc-sub { color:#7799bb; }
[data-theme="light"] .toc-week-header { color:#9aabbb; }
[data-theme="light"] .toc-item { background:rgba(255,255,255,.75); border-color:rgba(10,22,40,.07); }
[data-theme="light"] .toc-word { color:#0a1628; }
[data-theme="light"] .toc-meaning { color:#334466; }
[data-theme="light"] .toc-tag-sm { color:#99aacc; }
[data-theme="light"] .wf-btn { color:#88aacc; border-color:rgba(10,22,40,.09); }
[data-theme="light"] .wf-btn.active { background:rgba(200,16,46,.09); border-color:#C8102Eaa; color:#C8102E; }
[data-theme="light"] .mascot-widget { background:rgba(255,255,255,.55); border-color:rgba(10,22,40,.07); }
[data-theme="light"] .mascot-name { color:#0a1628; }
[data-theme="light"] .mascot-lv { color:#6688aa; }
[data-theme="light"] .mascot-bar { background:rgba(10,22,40,.06); }
[data-theme="light"] .quiz-btn { background:linear-gradient(135deg,rgba(200,16,46,.09),rgba(255,215,0,.07)); border-color:rgba(200,16,46,.25); color:#C8102E; }
[data-theme="light"] #page-card { background:#F0F4FF; }
[data-theme="light"] .back-btn { background:rgba(10,22,40,.06); border-color:rgba(10,22,40,.09); color:#334466; }
[data-theme="light"] .speak-btn { background:rgba(10,22,40,.05); border-color:rgba(10,22,40,.08); color:#446688; }
[data-theme="light"] .card-scene { opacity:.18 !important; }
[data-theme="light"] .card-word { color:#0a1628 !important; text-shadow:none !important; }

/* ── Learned tracking (localStorage) ── */
let LEARNED = JSON.parse(localStorage.getItem('spaceZh_learned')||'{}');

function saveLearned(){ localStorage.setItem('spaceZh_learned', JSON.stringify(LEARNED)); }

function learnedCount(){ return Object.values(LEARNED).filter(Boolean).length; }

function toggleLearned(day){
  LEARNED[day] = !LEARNED[day];
  saveLearned();
  updateLearnedUI();
  if(LEARNED[day]){
    const face = document.getElementById('mascot-face');
    face.classList.remove('pop');
    void face.offsetWidth;
    face.classList.add('pop');
  }
}

function updateLearnedUI(){
  const n = learnedCount();
  const total = WORDS.length;
  const pct = Math.round(n/total*100);

  document.getElementById('toc-sub-stats').textContent = `${n} / ${total} 習得 · ${pct}%`;

  const btn = document.getElementById('learned-btn');
  if(btn){
    const isLearned = !!LEARNED[WORDS[cur]?.day];
    btn.textContent = isLearned ? '★ 習得済み' : '✓ 覚えた';
    btn.classList.toggle('done', isLearned);
  }

  document.querySelectorAll('.toc-item').forEach(el=>{
    const idx = parseInt(el.dataset.idx);
    const day = WORDS[idx]?.day;
    el.classList.toggle('learned', !!LEARNED[day]);
  });

  renderMascot(pct);
}

}

/* ── Quiz ── */
let quizQueue=[], quizIdx=0, quizSession={total:0,learned:0}, quizRevealed=false;

function startQuiz(){
  let pool = WORDS.filter(w=>!LEARNED[w.day]);
  if(pool.length===0) pool=[...WORDS];
  quizQueue = pool.sort(()=>Math.random()-.5);
  quizIdx=0; quizSession={total:quizQueue.length,learned:0}; quizRevealed=false;

  document.getElementById('quiz-overlay').classList.remove('hidden');
  document.getElementById('quiz-result').classList.add('hidden');
  document.getElementById('quiz-card-area').style.display='';
  document.getElementById('quiz-btns').style.display='';
  showQuizCard();
}

function showQuizCard(){
  if(quizIdx>=quizQueue.length){ endQuiz(); return; }
  const w = quizQueue[quizIdx];
  quizRevealed=false;
  document.getElementById('quiz-word').textContent = w.word;
  document.getElementById('quiz-kana').textContent = w.pinyin + ' | ' + w.pron;
  document.getElementById('quiz-meaning').textContent = w.meaning;
  document.getElementById('quiz-meaning').classList.add('hidden-val');
  document.getElementById('quiz-tap-hint').style.opacity='1';
  document.getElementById('quiz-progress-text').textContent = `${quizIdx+1} / ${quizQueue.length}`;
  document.getElementById('quiz-score-badge').textContent = `✓ ${quizSession.learned}`;
  const pct = Math.round(quizIdx/quizQueue.length*100);
  document.getElementById('quiz-bar-fill').style.width = pct+'%';
}

function revealQuiz(){
  if(quizRevealed) return;
  quizRevealed=true;
  document.getElementById('quiz-meaning').classList.remove('hidden-val');
  document.getElementById('quiz-tap-hint').style.opacity='0';
}

function endQuiz(){
  document.getElementById('quiz-card-area').style.display='none';
  document.getElementById('quiz-btns').style.display='none';
  document.getElementById('quiz-result').classList.remove('hidden');
  const n=quizSession.learned, t=quizSession.total;
  const emojis=['😅','🌱','🚀','⭐','🌟','🏆'];
  const pct = Math.round(n/t*100);
  const emojiIdx = Math.min(Math.floor(pct/20),5);
  document.getElementById('quiz-result-emoji').textContent = emojis[emojiIdx];
  document.getElementById('quiz-result-title').textContent =
    pct===100?'パーフェクト！🎉':pct>=60?'よくできました！':'もう一息！';
  document.getElementById('quiz-result-sub').textContent =
    `${t}問中 ${n}問正解 (${pct}%)\n覚えた単語: ${learnedCount()} / ${WORDS.length}`;
  document.getElementById('quiz-bar-fill').style.width='100%';
}

document.getElementById('quiz-card-area').addEventListener('click',()=>{
  if(!quizRevealed) revealQuiz();
});
document.getElementById('quiz-learned-btn').addEventListener('click',()=>{
  if(!quizRevealed){ revealQuiz(); return; }
  const w=quizQueue[quizIdx];
  if(!LEARNED[w.day]){ LEARNED[w.day]=true; saveLearned(); updateLearnedUI(); quizSession.learned++; }
  quizIdx++; showQuizCard();
});
document.getElementById('quiz-skip-btn').addEventListener('click',()=>{
  if(!quizRevealed){ revealQuiz(); return; }
  quizIdx++; showQuizCard();
});
document.getElementById('quiz-close-btn').addEventListener('click',()=>{
  document.getElementById('quiz-overlay').classList.add('hidden');
  updateLearnedUI(); renderToc();
});
document.getElementById('quiz-again-btn').addEventListener('click',()=>startQuiz());
document.getElementById('quiz-start-btn').addEventListener('click',()=>startQuiz());
document.getElementById('learned-btn').addEventListener('click',()=>{
  toggleLearned(WORDS[cur].day);
  updateLearnedUI();
});

/* ── Build TOC ── */
let filterWeek = 'all';

function buildToc(){
  const wf = document.getElementById('week-filter');
  wf.innerHTML = `<button class="wf-btn active" data-w="all">ALL 30</button>`;
  for(let w=1;w<=6;w++){
    wf.innerHTML += `<button class="wf-btn" data-w="${w}">W${w}</button>`;
  }
  wf.querySelectorAll('.wf-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      wf.querySelectorAll('.wf-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filterWeek = btn.dataset.w;
      renderToc();
    });
  });
  renderToc();
}

function renderToc(){
  const body = document.getElementById('toc-body');
  const weeks = filterWeek==='all' ? [1,2,3,4,5,6] : [parseInt(filterWeek)];
  let html = '';
  weeks.forEach(wk=>{
    const ws = WORDS.filter(w=>w.week===wk);
    if(!ws.length) return;
    html += `<div class="toc-week-header">WEEK ${wk} ─ ${WEEK_CAT[wk]}</div>`;
    html += '<div class="toc-grid">';
    ws.forEach(w=>{
      const idx = WORDS.indexOf(w);
      html += `<div class="toc-item" style="--c:${w.acc}" data-idx="${idx}">
        <div class="toc-day">DAY ${String(w.day).padStart(2,'0')}${w.gold?' ★':''}</div>
        <div class="toc-word">${w.word}</div>
        <div class="toc-meaning">${w.meaning}</div>
        <div class="toc-tag-sm">${w.tag}</div>
      </div>`;
    });
    html += '</div>';
  });
  body.innerHTML = html;
  body.querySelectorAll('.toc-item').forEach(el=>{
    el.addEventListener('click',()=>openCard(parseInt(el.dataset.idx)));
    const day = WORDS[parseInt(el.dataset.idx)]?.day;
    if(LEARNED[day]) el.classList.add('learned');
  });
}

let cur=0, exOpen=false;

function openCard(idx){
  cur=idx; exOpen=false;
  render(null);
  document.getElementById('page-toc').classList.add('hidden');
  document.getElementById('page-card').classList.remove('hidden');
  speakNow();
}

/* ── Render ── */
function render(fx){
  const w=WORDS[cur];
  const main=document.getElementById('card-main');
  const panel=document.getElementById('ex-panel');
  exOpen=false;
  main.classList.remove('ex-open');
  panel.classList.remove('show');

  if(fx){ main.classList.add(fx); setTimeout(()=>main.classList.remove(fx),300); }

  const [R,G,B]=w.planet[0].split(',').map(Number);
  document.getElementById('card-scene').style.backgroundImage=mkBg(getBg(w),R,G,B);
  document.getElementById('card-emoji').textContent=getEmoji(w.x);

  document.getElementById('card-cat').textContent=WEEK_CAT[w.week];
  document.getElementById('card-cat').style.color=w.acc;
  document.getElementById('card-day').textContent=`DAY ${String(w.day).padStart(2,'0')}`;
  document.getElementById('card-day').style.cssText=`border-color:${w.acc};color:${w.acc}`;
  document.getElementById('card-word').textContent=w.word;
  document.getElementById('card-word').style.cssText=`color:${w.gold?'#FFD700':'#ffffff'};text-shadow:0 0 36px ${w.acc}44,0 0 72px ${w.acc}18`;
  document.getElementById('pho-pinyin').textContent=w.pinyin;
  document.getElementById('pho-kana').textContent=w.pron;
  document.getElementById('card-line').style.background=`linear-gradient(90deg,transparent,${w.acc},transparent)`;
  document.getElementById('card-meaning').textContent=w.meaning;
  document.getElementById('card-meaning').style.color=w.acc;
  document.getElementById('card-counter').textContent=`${cur+1} / ${WORDS.length}`;
  document.getElementById('prog-fill').style.width=`${((cur+1)/WORDS.length)*100}%`;
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===WORDS.length-1;

  const lBtn=document.getElementById('learned-btn');
  const isL=!!LEARNED[w.day];
  lBtn.textContent=isL?'★ 習得済み':'✓ 覚えた';
  lBtn.classList.toggle('done',isL);

  document.getElementById('ex-tag').style.color=w.acc;
  document.getElementById('ex-zh').textContent=w.ex_zh;
  const kanaEl=document.getElementById('ex-kana');
  kanaEl.textContent=w.ex_kana||'';
  kanaEl.style.display=w.ex_kana?'':'none';
  document.getElementById('ex-jp').textContent=w.ex_jp;
  document.getElementById('ex-naze').textContent=w.naze;
  document.getElementById('ex-x').textContent=w.x||'';
}

/* ── Toggle example ── */
function toggleEx(){
  exOpen=!exOpen;
  document.getElementById('card-main').classList.toggle('ex-open',exOpen);
  document.getElementById('ex-panel').classList.toggle('show',exOpen);
}

/* ── Tap / click on card-main ── */
const cardMain=document.getElementById('card-main');
let tapX,tapY,tapT;
cardMain.addEventListener('touchstart',e=>{tapX=e.touches[0].clientX;tapY=e.touches[0].clientY;tapT=Date.now();},{passive:true});
cardMain.addEventListener('touchend',e=>{
  if(Math.abs(e.changedTouches[0].clientX-tapX)<12&&Math.abs(e.changedTouches[0].clientY-tapY)<12&&Date.now()-tapT<300)toggleEx();
});
cardMain.addEventListener('click',e=>{if(!e.target.closest('.ex-panel'))toggleEx();});
document.getElementById('ex-panel').addEventListener('click',e=>e.stopPropagation());
document.getElementById('ex-panel').addEventListener('touchend',e=>e.stopPropagation());

/* ── Swipe (on page-card, not card-main) ── */
let swX,swY;
const cardPage=document.getElementById('page-card');
cardPage.addEventListener('touchstart',e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
cardPage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>44)go(dx<0?1:-1);
});

/* ── Navigate ── */
function go(dir){const n=cur+dir;if(n<0||n>=WORDS.length)return;cur=n;render(dir>0?'fx-l':'fx-r');speakNow();}
document.getElementById('prev-btn').addEventListener('click',()=>go(-1));
document.getElementById('next-btn').addEventListener('click',()=>go(1));

/* ── Back ── */
document.getElementById('back-btn').addEventListener('click',()=>{
  window.speechSynthesis&&window.speechSynthesis.cancel();
  document.getElementById('page-card').classList.add('hidden');
  document.getElementById('page-toc').classList.remove('hidden');
});

/* ── Keyboard ── */
document.addEventListener('keydown',e=>{
  if(document.getElementById('page-card').classList.contains('hidden'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);
  if(e.key===' '){e.preventDefault();toggleEx();}
  if(e.key==='Escape')document.getElementById('back-btn').click();
});

/* ── Speak word ── */
function speakNow(){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(WORDS[cur].word);
    u.lang='zh-CN';u.rate=0.85;u.pitch=1.0;
    window.speechSynthesis.speak(u);
  },320);
}
document.getElementById('speak-btn').addEventListener('click',speakNow);

/* ── Speak example ── */
function speakEx(){
  if(!window.speechSynthesis)return;
  const btn=document.getElementById('ex-speak-btn');
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(WORDS[cur].ex_zh);
  u.lang='zh-CN';u.rate=0.80;u.pitch=1.0;
  u.onstart=()=>btn.classList.add('playing');
  u.onend=()=>btn.classList.remove('playing');
  u.onerror=()=>btn.classList.remove('playing');
  window.speechSynthesis.speak(u);
}
document.getElementById('ex-speak-btn').addEventListener('click',e=>{e.stopPropagation();speakEx();});
document.getElementById('ex-speak-btn').addEventListener('touchend',e=>{e.stopPropagation();});

/* ── Theme toggle ── */
const THEME_KEY='spaceZh_theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-toggle').textContent=t==='light'?'🌙':'☀️';
  localStorage.setItem(THEME_KEY,t);
}
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
document.getElementById('theme-toggle').addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
});

/* ── Init ── */
buildToc();
updateLearnedUI();
</script>
</body>
</html>
