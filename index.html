<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🚀 宇宙中国語 単語帳 — ZATT-MAN</title>
<meta property="og:title" content="🚀 宇宙中国語 単語帳 — ZATT-MAN">
<meta property="og:description" content="宇宙×中国語 30単語。神舟から未来へ 🛸">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZATT-MAN SPACE CHINESE">
<meta name="theme-color" content="#0D1B2A">
<style>
:root {
  --bg:#0D1B2A; --text:#E8EDF5; --subtext:#7A8FA8;
  --accent:#C8102E; --accent2:#FFD700;
  --card-bg:rgba(255,255,255,.05); --card-border:rgba(255,255,255,.09);
  --gold:#FFD700;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;}
body{background:var(--bg);color:var(--text);overscroll-behavior:none;}

.stars-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(ellipse 900px 600px at 15% 20%,rgba(200,16,46,.05),transparent),
    radial-gradient(ellipse 600px 600px at 85% 75%,rgba(255,215,0,.04),transparent),
    radial-gradient(1px 1px at 8% 7%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 23% 15%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.5px 1.5px at 39% 5%,rgba(255,255,255,.60),transparent),
    radial-gradient(1px 1px at 54% 21%,rgba(255,255,255,.40),transparent),
    radial-gradient(1px 1px at 69% 10%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.5px 1.5px at 85% 18%,rgba(255,255,255,.65),transparent),
    radial-gradient(1px 1px at 95% 34%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 5% 42%,rgba(255,255,255,.50),transparent),
    radial-gradient(1px 1px at 18% 55%,rgba(255,255,255,.40),transparent),
    radial-gradient(1px 1px at 32% 48%,rgba(255,255,255,.50),transparent),
    radial-gradient(1.5px 1.5px at 48% 62%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 63% 70%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 78% 58%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 90% 75%,rgba(255,255,255,.60),transparent),
    radial-gradient(1px 1px at 12% 82%,rgba(255,255,255,.50),transparent),
    radial-gradient(1px 1px at 35% 88%,rgba(255,255,255,.40),transparent),
    radial-gradient(1.5px 1.5px at 60% 92%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 75% 85%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,.30),transparent),
    radial-gradient(1px 1px at 22% 30%,rgba(255,255,255,.35),transparent),
    radial-gradient(1px 1px at 44% 73%,rgba(255,255,255,.38),transparent),
    radial-gradient(1px 1px at 87% 43%,rgba(255,255,255,.42),transparent);
}

/* ── Theme toggle ── */
.theme-toggle{
  position:fixed;top:14px;right:70px;z-index:300;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  color:#667;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.theme-toggle:active{transform:scale(.9);}
[data-theme="light"] .theme-toggle{background:rgba(13,27,42,.06);border-color:rgba(13,27,42,.08);color:#446688;}

/* ══ TOC ══ */
#page-toc{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;transition:transform .35s ease,opacity .35s ease;}
#page-toc.hidden{transform:translateY(-100%);opacity:0;pointer-events:none;}

.toc-header{padding:18px 20px 8px;text-align:center;flex-shrink:0;background:linear-gradient(180deg,rgba(13,27,42,.97) 65%,transparent);}
.toc-logo{font-size:8px;letter-spacing:6px;color:rgba(200,16,46,.5);margin-bottom:6px;}
.toc-title{font-size:20px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#C8102E,#fff 55%,#C8102E);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:3px;}
.toc-sub{font-size:8px;color:#2e3e52;letter-spacing:4px;}

.toc-filter{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.toc-filter::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;font-size:8px;letter-spacing:2px;padding:5px 12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#7a8fa8;cursor:pointer;transition:all .2s;}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,16,46,.12);}

.toc-scroll{flex:1;overflow-y:auto;padding:6px 12px 24px;-webkit-overflow-scrolling:touch;}
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.toc-item{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);
  border-radius:12px;padding:12px 11px 10px;cursor:pointer;
  transition:all .18s;display:flex;flex-direction:column;gap:2px;
  position:relative;overflow:hidden;
}
.toc-item::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--c,transparent) 0%,transparent 68%);
  opacity:.055;pointer-events:none;
}
.toc-item:active{transform:scale(.96);}
.toc-item.active-card{border-color:var(--accent);background:rgba(200,16,46,.1);}
.toc-day{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--c,#C8102E);}
.toc-word{font-size:19px;font-weight:900;color:#E8EDF5;line-height:1.1;}
.toc-meaning{font-size:11px;color:#556677;margin-top:1px;}
.toc-tag-sm{font-size:8px;color:#334455;margin-top:2px;line-height:1.3;}
.toc-week-header{grid-column:1/-1;font-size:8px;font-weight:700;letter-spacing:3px;color:#333;padding:12px 4px 6px;text-transform:uppercase;}

/* mascot */
.mascot-wrap{display:flex;align-items:center;gap:8px;padding:8px 16px 4px;flex-shrink:0;}
.mascot-face{font-size:28px;transition:transform .3s;cursor:default;flex-shrink:0;}
.mascot-face.pop{animation:mascotPop .4s ease;}
@keyframes mascotPop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-8deg)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.mascot-info{flex:1;min-width:0;}
.mascot-level{font-size:7px;letter-spacing:3px;color:var(--accent);font-weight:800;margin-bottom:2px;}
.mascot-name{font-size:10px;font-weight:700;color:var(--text);}
.mascot-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:4px;overflow:hidden;}
.mascot-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s ease;}
.learned-stats{font-size:9px;color:#3a5268;letter-spacing:2px;margin-top:4px;}

/* quiz btn */
.quiz-btn{
  margin:8px 16px 0;padding:10px 0;border-radius:12px;
  background:linear-gradient(135deg,rgba(200,16,46,.18),rgba(255,215,0,.12));
  border:1px solid rgba(200,16,46,.28);color:#f08090;
  font-size:10px;font-weight:800;letter-spacing:3px;cursor:pointer;transition:all .22s;
  width:calc(100% - 32px);
}
.quiz-btn:active{transform:scale(.97);}

/* ══ CARD PAGE ══ */
#page-card{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  background:var(--bg);transition:transform .35s ease,opacity .35s ease;
}
#page-card.hidden{transform:translateY(100%);opacity:0;pointer-events:none;}

.card-topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;flex-shrink:0;z-index:2;position:relative;}
.back-btn{background:var(--card-bg);border:1px solid var(--card-border);color:var(--subtext);font-size:10px;padding:7px 15px;border-radius:20px;cursor:pointer;letter-spacing:1.5px;transition:all .2s;}
.back-btn:active{background:rgba(255,255,255,.14);color:var(--text);}
.card-day-badge{font-size:9px;font-weight:700;letter-spacing:4px;padding:5px 16px;border-radius:14px;border:1px solid;}
.speak-btn{width:42px;height:42px;border-radius:50%;background:var(--card-bg);border:1px solid var(--card-border);color:var(--subtext);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.speak-btn:active{border-color:var(--accent);color:var(--accent);}

.card-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center;user-select:none;cursor:pointer;position:relative;overflow:hidden;padding:0 32px;}
.card-scene{position:absolute;inset:0;pointer-events:none;z-index:0;transition:background-image .4s ease;}
.card-emoji{position:absolute;pointer-events:none;z-index:1;bottom:6%;right:-1%;font-size:clamp(110px,30vw,155px);line-height:1;opacity:0.05;transform:rotate(-10deg);transition:opacity .3s;user-select:none;}
.card-content{position:relative;z-index:2;transition:transform .35s ease;}
.card-main.ex-open .card-content{transform:translateY(-16px);}
.card-main.ex-open .card-emoji{opacity:0.028;}
.card-cat{font-size:8px;font-weight:700;letter-spacing:4px;margin-bottom:14px;opacity:.55;text-transform:uppercase;}
.card-word{font-size:clamp(52px,15vw,96px);font-weight:900;line-height:1.02;letter-spacing:2px;margin-bottom:6px;}
.card-pinyin{font-size:18px;font-weight:400;color:var(--accent);letter-spacing:2px;margin-bottom:6px;font-style:italic;}
.card-phonetics{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.pho-kana{font-size:14px;color:rgba(255,255,255,.45);letter-spacing:2px;}
.card-line{width:52px;height:1.5px;border-radius:1px;margin-bottom:16px;}
.card-meaning{font-size:26px;font-weight:700;letter-spacing:2px;}
.tap-hint{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.15);margin-top:20px;transition:opacity .3s;}
.card-main.ex-open .tap-hint{opacity:0;}

/* example panel */
.ex-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(13,27,42,0.97);backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.09);
  border-radius:18px 18px 0 0;padding:16px 20px 32px;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.4,.0,.2,1);
  z-index:5;
}
.ex-panel.show{transform:translateY(0);}
.ex-handle{width:34px;height:3px;background:var(--card-border);border-radius:2px;margin:0 auto 14px;}
.ex-tag-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.ex-tag{font-size:8px;font-weight:700;letter-spacing:3px;}
.ex-speak-btn{width:34px;height:34px;border-radius:50%;background:var(--card-bg);border:1px solid var(--card-border);color:var(--subtext);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.ex-speak-btn:active{border-color:var(--accent);color:var(--accent);}
.ex-speak-btn.playing{border-color:var(--accent);color:var(--accent);}
.ex-zh{font-size:16px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:4px;}
.ex-kana{font-size:11px;color:rgba(200,16,46,.75);letter-spacing:.8px;margin-bottom:8px;font-style:italic;border-left:2px solid rgba(200,16,46,.28);padding:2px 8px;background:rgba(200,16,46,.06);border-radius:0 4px 4px 0;line-height:1.6;}
.ex-jp{font-size:13px;color:var(--subtext);margin-bottom:12px;line-height:1.4;}
.ex-hr{height:1px;background:var(--card-border);margin-bottom:10px;}
.ex-naze-tag{font-size:8px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:6px;}
.ex-naze{font-size:12px;color:#6a8aaa;line-height:1.7;margin-bottom:10px;}
.ex-x-tag{font-size:8px;font-weight:700;letter-spacing:2px;color:#2a3a4a;margin-bottom:4px;margin-top:4px;}
.ex-x{font-size:10px;color:#2a3a4a;line-height:1.6;}

/* bottom nav */
.card-bottom{flex-shrink:0;padding:10px 24px 26px;display:flex;flex-direction:column;gap:12px;align-items:center;}
.card-counter{font-size:9px;color:#3a5268;letter-spacing:4px;}
.card-nav{display:flex;align-items:center;gap:20px;}
.nav-btn{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;line-height:1;}
.nav-btn:active{background:rgba(255,255,255,.13);color:#fff;}
.nav-btn:disabled{opacity:.14;cursor:default;}
.progress-bar{width:100%;height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s ease;}
@keyframes fxR{0%{opacity:1;transform:none}38%{opacity:0;transform:translateX(26px)}39%{opacity:0;transform:translateX(-26px)}100%{opacity:1;transform:none}}
@keyframes fxL{0%{opacity:1;transform:none}38%{opacity:0;transform:translateX(-26px)}39%{opacity:0;transform:translateX(26px)}100%{opacity:1;transform:none}}

.learned-btn{display:flex;align-items:center;gap:6px;padding:8px 20px;border-radius:20px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.36);font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;}
.learned-btn.done{border-color:#32c87a;color:#32c87a;background:rgba(50,200,122,.12);}
.learned-btn:active{transform:scale(.94);}
.toc-item.learned{opacity:.6;}
.toc-item.learned .toc-day::after{content:' ✓';color:#32c87a;}

/* ══ QUIZ OVERLAY ══ */
#quiz-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .3s;}
#quiz-overlay.hidden{opacity:0;pointer-events:none;}
.quiz-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--subtext);font-size:22px;cursor:pointer;padding:8px;}
.quiz-label{font-size:8px;letter-spacing:4px;color:var(--accent);margin-bottom:16px;}
.quiz-word{font-size:clamp(44px,14vw,80px);font-weight:900;margin-bottom:8px;}
.quiz-pinyin{font-size:16px;color:var(--accent);letter-spacing:2px;margin-bottom:24px;font-style:italic;}
.quiz-reveal{display:none;text-align:center;}
.quiz-reveal.show{display:block;}
.quiz-meaning{font-size:20px;font-weight:700;color:var(--text);margin-bottom:20px;}
.quiz-actions{display:flex;gap:16px;}
.quiz-action-btn{flex:1;padding:14px 0;border-radius:14px;border:1.5px solid;font-size:11px;font-weight:800;letter-spacing:2px;cursor:pointer;background:transparent;transition:all .2s;}
.quiz-action-btn.yes{border-color:#32c87a;color:#32c87a;}
.quiz-action-btn.no{border-color:var(--accent);color:var(--accent);}
.quiz-action-btn:active{transform:scale(.95);}
.quiz-tap-hint{font-size:10px;color:var(--subtext);letter-spacing:2px;margin-bottom:24px;}
.quiz-progress-wrap{width:100%;max-width:320px;margin-top:24px;}
.quiz-bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s;}
.quiz-result{text-align:center;display:none;}
.quiz-result.show{display:block;}
.quiz-result-emoji{font-size:60px;margin-bottom:12px;}
.quiz-result-title{font-size:22px;font-weight:800;margin-bottom:8px;}
.quiz-result-sub{font-size:12px;color:var(--subtext);margin-bottom:24px;}
.quiz-result-btn{padding:12px 32px;border-radius:12px;background:var(--accent);color:#fff;border:none;font-size:11px;font-weight:800;letter-spacing:2px;cursor:pointer;}

/* ══ LIGHT MODE ══ */
[data-theme="light"] body{background:#F0F4FF;color:#0a1628;}
[data-theme="light"] .stars-bg{opacity:0;}
[data-theme="light"] .card-scene{opacity:.12 !important;}
[data-theme="light"] .card-word{color:#0a1628 !important;text-shadow:none !important;}
[data-theme="light"] .card-meaning{color:#1a2c40;}
[data-theme="light"] .card-cat{color:#6688aa;}
[data-theme="light"] .card-pinyin{color:#C8102E;}
[data-theme="light"] .pho-kana{color:rgba(10,22,40,.45);}
[data-theme="light"] .tap-hint{color:rgba(10,22,40,.2);}
[data-theme="light"] .toc-header{background:linear-gradient(180deg,rgba(240,244,255,.97) 60%,transparent);}
[data-theme="light"] .toc-logo{color:rgba(10,22,40,.22);}
[data-theme="light"] .toc-title{background:linear-gradient(135deg,#C8102E,#0a1628 55%,#C8102E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
[data-theme="light"] .toc-sub{color:#7799bb;}
[data-theme="light"] .toc-week-header{color:#9aabbb;}
[data-theme="light"] .toc-item{background:rgba(255,255,255,.75);border-color:rgba(10,22,40,.07);}
[data-theme="light"] .toc-word{color:#0a1628;}
[data-theme="light"] .toc-meaning{color:#446688;}
[data-theme="light"] .toc-tag-sm{color:#99aacc;}
[data-theme="light"] .filter-btn{background:rgba(10,22,40,.04);border-color:rgba(10,22,40,.09);color:#6688aa;}
[data-theme="light"] .filter-btn.active{border-color:#C8102E;color:#C8102E;background:rgba(200,16,46,.08);}
[data-theme="light"] .ex-panel{background:rgba(240,244,255,.97);}
[data-theme="light"] .ex-zh{color:#0a1628;}
[data-theme="light"] .ex-kana{color:#C8102E;background:rgba(200,16,46,.06);border-left-color:rgba(200,16,46,.28);}
[data-theme="light"] .ex-jp{color:#446688;}
[data-theme="light"] .ex-hr{background:rgba(10,22,40,.06);}
[data-theme="light"] .ex-naze{color:#445566;}
[data-theme="light"] .ex-x{color:#7799bb;}
[data-theme="light"] .ex-speak-btn{background:rgba(10,22,40,.05);border-color:rgba(10,22,40,.09);color:#446688;}
[data-theme="light"] .nav-btn{background:rgba(10,22,40,.05);border-color:rgba(10,22,40,.08);color:rgba(10,22,40,.55);}
[data-theme="light"] .progress-bar{background:rgba(10,22,40,.07);}
[data-theme="light"] .card-counter{color:#99aacc;}
[data-theme="light"] .mascot-bar{background:rgba(10,22,40,.07);}
[data-theme="light"] .mascot-name{color:#0a1628;}
[data-theme="light"] .mascot-level{color:#C8102E;}
[data-theme="light"] .learned-stats{color:#99aacc;}
[data-theme="light"] .quiz-btn{background:linear-gradient(135deg,rgba(200,16,46,.09),rgba(255,215,0,.07));border-color:rgba(200,16,46,.25);color:#C8102E;}
[data-theme="light"] #page-card{background:#F0F4FF;}
[data-theme="light"] .back-btn{background:rgba(10,22,40,.06);border-color:rgba(10,22,40,.09);color:#334466;}
[data-theme="light"] .speak-btn{background:rgba(10,22,40,.05);border-color:rgba(10,22,40,.08);color:#446688;}
[data-theme="light"] #quiz-overlay{background:#F0F4FF;}
[data-theme="light"] .quiz-word{color:#0a1628;}
[data-theme="light"] .quiz-pinyin{color:#C8102E;}
[data-theme="light"] .quiz-result-title{color:#0a1628;}
[data-theme="light"] .quiz-result-sub{color:#6688aa;}
[data-theme="light"] .quiz-bar{background:rgba(10,22,40,.07);}
</style>
</head>
<body>
<div class="stars-bg"></div>
<button class="theme-toggle" id="theme-toggle" title="ダーク / ライト切替">☀️</button>

<!-- ── TOC ── -->
<div id="page-toc">
  <div class="toc-header">
    <div class="toc-logo">ZATT-MAN × SPACE CHINESE</div>
    <div class="toc-title">宇宙中国語 単語帳</div>
    <div class="toc-sub">SPACE CHINESE VOCABULARY</div>
  </div>
  <div class="mascot-wrap">
    <div class="mascot-face" id="mascot-face">🥚</div>
    <div class="mascot-info">
      <div class="mascot-level" id="mascot-level">LEVEL 1</div>
      <div class="mascot-name" id="mascot-name">太空蛋</div>
      <div class="mascot-bar"><div class="mascot-bar-fill" id="mascot-bar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="learned-stats" id="learned-stats" style="padding:0 20px 4px;"></div>
  <button class="quiz-btn" id="quiz-start-btn">🎯 クイズモード</button>
  <div class="toc-filter" id="toc-filter"></div>
  <div class="toc-scroll"><div class="toc-grid" id="toc-grid"></div></div>
</div>

<!-- ── FLASHCARD ── -->
<div id="page-card" class="hidden">

/* ── Background art ── */
const EMOJIS=['🌏','🚀','🛸','🌕','⭐','🔭','🛰️','🌌','🌠','🌙'];
const BG_CYCLE=['planet','moon','star','rocket','nebula','orbit','signal','horizon','wave','heart','particles'];
function getBgType(w){return w.gold?'star':BG_CYCLE[(w.day-1)%BG_CYCLE.length];}
function mkBg(w){
  const parts=(w.planet[0]||'200,16,46').split(',');
  const R=parseInt(parts[0])||200,G=parseInt(parts[1])||16,B=parseInt(parts[2])||46;
  const c=(a)=>`rgba(${R},${G},${B},${a})`,wh=(a)=>`rgba(255,255,255,${a})`;
  switch(getBgType(w)){
    case 'planet':return[`radial-gradient(circle 260px at 82% 87%,${c(.38)} 0%,${c(.14)} 44%,transparent 66%)`,`radial-gradient(circle 120px at 82% 87%,${c(.55)} 0%,${c(.20)} 50%,transparent 70%)`,`radial-gradient(circle 50px at 82% 87%,${wh(.18)} 0%,transparent 50%)`,`radial-gradient(circle 245px at 82% 87%,transparent 228px,${c(.22)} 232px,transparent 248px)`].join(',');
    case 'moon':return[`radial-gradient(circle 210px at 80% 22%,${c(.36)} 0%,${c(.10)} 44%,transparent 65%)`,`radial-gradient(circle 96px at 80% 22%,${c(.55)} 0%,${c(.18)} 50%,transparent 70%)`,`radial-gradient(circle 40px at 80% 22%,${wh(.18)} 0%,transparent 50%)`,`radial-gradient(circle 205px at 80% 22%,transparent 190px,${c(.18)} 194px,transparent 208px)`].join(',');
    case 'star':return[`radial-gradient(circle 200px at 68% 26%,${c(.28)} 0%,transparent 56%)`,`radial-gradient(circle 48px at 68% 26%,${c(.70)} 0%,transparent 50%)`,`radial-gradient(circle 12px at 68% 26%,${wh(.88)} 0%,transparent 50%)`,`radial-gradient(2.5px 2.5px at 25% 55%,${wh(.70)},transparent)`,`radial-gradient(2px 2px at 82% 65%,${wh(.62)},transparent)`,`radial-gradient(1.5px 1.5px at 12% 30%,${wh(.55)},transparent)`,`radial-gradient(1.5px 1.5px at 55% 80%,${wh(.48)},transparent)`].join(',');
    case 'rocket':return[`radial-gradient(ellipse 70px 340px at 50% 105%,${c(.38)} 0%,transparent 56%)`,`radial-gradient(ellipse 32px 180px at 50% 105%,rgba(255,200,80,.42) 0%,transparent 46%)`,`radial-gradient(ellipse 14px 80px at 50% 105%,${wh(.30)} 0%,transparent 40%)`,`radial-gradient(circle 55px at 50% 80%,${c(.22)} 0%,transparent 50%)`,`radial-gradient(circle 28px at 50% 78%,${c(.30)} 0%,transparent 50%)`].join(',');
    case 'nebula':return[`radial-gradient(ellipse 340px 220px at 62% 40%,${c(.22)} 0%,transparent 56%)`,`radial-gradient(ellipse 220px 170px at 28% 68%,${c(.16)} 0%,transparent 52%)`,`radial-gradient(ellipse 160px 95px at 75% 72%,${c(.18)} 0%,transparent 48%)`,`radial-gradient(2px 2px at 15% 20%,${wh(.62)},transparent)`,`radial-gradient(1.5px 1.5px at 55% 35%,${wh(.52)},transparent)`,`radial-gradient(1.5px 1.5px at 85% 15%,${wh(.58)},transparent)`,`radial-gradient(1px 1px at 40% 70%,${wh(.42)},transparent)`].join(',');
    case 'orbit':return[`radial-gradient(circle 62px at 50% 74%,${c(.32)} 0%,transparent 50%)`,`radial-gradient(circle 30px at 50% 74%,${c(.55)} 0%,transparent 50%)`,`radial-gradient(ellipse 280px 95px at 50% 74%,transparent 148px,${c(.24)} 152px,transparent 160px)`,`radial-gradient(ellipse 215px 72px at 50% 74%,transparent 108px,${c(.18)} 112px,transparent 120px)`,`radial-gradient(circle 14px at 88% 52%,${c(.65)} 0%,transparent 50%)`,`radial-gradient(circle 7px at 88% 52%,${wh(.40)} 0%,transparent 50%)`].join(',');
    case 'signal':return[`radial-gradient(circle 230px at 78% 42%,transparent 162px,${c(.24)} 166px,transparent 172px)`,`radial-gradient(circle 230px at 78% 42%,transparent 124px,${c(.20)} 128px,transparent 134px)`,`radial-gradient(circle 230px at 78% 42%,transparent 90px,${c(.18)} 94px,transparent 100px)`,`radial-gradient(circle 230px at 78% 42%,transparent 60px,${c(.15)} 63px,transparent 69px)`,`radial-gradient(circle 20px at 78% 42%,${c(.55)} 0%,transparent 50%)`,`radial-gradient(circle 8px at 78% 42%,${wh(.75)} 0%,transparent 50%)`].join(',');
    case 'horizon':return[`radial-gradient(ellipse 440px 140px at 50% 100%,${c(.45)} 0%,transparent 56%)`,`radial-gradient(ellipse 300px 80px at 50% 100%,${c(.28)} 0%,transparent 50%)`,`linear-gradient(to top,${c(.14)} 0%,transparent 28%)`,`radial-gradient(2px 2px at 20% 40%,${wh(.62)},transparent)`,`radial-gradient(1.5px 1.5px at 60% 28%,${wh(.55)},transparent)`,`radial-gradient(1.5px 1.5px at 80% 55%,${wh(.48)},transparent)`].join(',');
    case 'wave':return[`radial-gradient(ellipse 360px 80px at 50% 38%,${c(.20)} 0%,transparent 50%)`,`radial-gradient(ellipse 320px 65px at 50% 52%,${c(.16)} 0%,transparent 50%)`,`radial-gradient(ellipse 270px 52px at 50% 64%,${c(.12)} 0%,transparent 50%)`,`radial-gradient(ellipse 200px 40px at 50% 75%,${c(.09)} 0%,transparent 50%)`].join(',');
    case 'heart':return[`radial-gradient(ellipse 240px 195px at 50% 42%,${c(.32)} 0%,transparent 54%)`,`radial-gradient(circle 80px at 50% 38%,${c(.50)} 0%,transparent 50%)`,`radial-gradient(circle 32px at 50% 38%,${c(.45)} 0%,transparent 50%)`,`radial-gradient(circle 12px at 50% 34%,${wh(.22)} 0%,transparent 50%)`].join(',');
    default:return[`radial-gradient(3px 3px at 12% 35%,${wh(.72)},transparent)`,`radial-gradient(3px 3px at 72% 18%,${wh(.65)},transparent)`,`radial-gradient(2.5px 2.5px at 52% 62%,${wh(.58)},transparent)`,`radial-gradient(2px 2px at 28% 72%,${wh(.52)},transparent)`,`radial-gradient(3px 3px at 83% 52%,${wh(.60)},transparent)`,`radial-gradient(circle 160px at 50% 50%,${c(.14)} 0%,transparent 60%)`].join(',');
  }
}

/* ── Learned storage ── */
const LEARNED_KEY='spaceZh_learned';
function getLearnedSet(){try{return new Set(JSON.parse(localStorage.getItem(LEARNED_KEY))||[]);}catch{return new Set();}}
function saveLearnedSet(s){localStorage.setItem(LEARNED_KEY,JSON.stringify([...s]));}

/* ── Mascot ── */
const MASCOT_LEVELS=[
  {min:0,  max:0,  face:'🥚', level:'LEVEL 1', name:'太空蛋'},
  {min:1,  max:12, face:'🐣', level:'LEVEL 2', name:'見習い生'},
  {min:13, max:25, face:'🧑‍🚀',level:'LEVEL 3', name:'訓練生'},
  {min:26, max:50, face:'🚀', level:'LEVEL 4', name:'神舟パイロット'},
  {min:51, max:74, face:'⭐', level:'LEVEL 5', name:'太空先鋒'},
  {min:75, max:89, face:'🌟', level:'LEVEL 6', name:'天宮司令'},
  {min:90, max:100,face:'🏆', level:'LEVEL 7', name:'宇宙英雄'},
];
function updateMascot(){
  const s=getLearnedSet();
  const pct=Math.round(s.size/WORDS.length*100);
  const lv=MASCOT_LEVELS.find(l=>pct<=l.max)||MASCOT_LEVELS[MASCOT_LEVELS.length-1];
  const old=document.getElementById('mascot-face').textContent;
  document.getElementById('mascot-face').textContent=lv.face;
  document.getElementById('mascot-level').textContent=lv.level;
  document.getElementById('mascot-name').textContent=lv.name;
  document.getElementById('mascot-bar').style.width=pct+'%';
  document.getElementById('learned-stats').textContent=`${s.size} / ${WORDS.length} 単語習得 (${pct}%)`;
  if(old!==lv.face){const f=document.getElementById('mascot-face');f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');}
}

/* ── TOC build ── */
let curFilter=0;
function buildToc(){
  const learned=getLearnedSet();
  const filter=document.getElementById('toc-filter');
  const grid=document.getElementById('toc-grid');
  filter.innerHTML='';
  grid.innerHTML='';
  const weeks=[...new Set(WORDS.map(w=>w.week))];
  ['ALL',...weeks.map(w=>`W${w}`)].forEach((label,i)=>{
    const b=document.createElement('button');
    b.className='filter-btn'+(curFilter===i?' active':'');
    b.textContent=label;
    b.addEventListener('click',()=>{curFilter=i;buildToc();});
    filter.appendChild(b);
  });
  let lastWeek=-1;
  const filtered=curFilter===0?WORDS:WORDS.filter(w=>w.week===curFilter);
  filtered.forEach(w=>{
    if(w.week!==lastWeek){
      const h=document.createElement('div');
      h.className='toc-week-header';
      const labels={1:'W1 基本語',2:'W2 宇航员・ミッション',3:'W3 天体',4:'W4 技術',5:'W5 宇宙ビジネス',6:'W6 ビジョン'};
      h.textContent=labels[w.week]||`W${w.week}`;
      grid.appendChild(h);
      lastWeek=w.week;
    }
    const item=document.createElement('div');
    item.className='toc-item'+(learned.has(w.day)?' learned':'');
    item.dataset.day=w.day;
    item.style.setProperty('--c',w.acc||'#C8102E');
    const day=document.createElement('div');day.className='toc-day';day.textContent=`DAY ${String(w.day).padStart(2,'0')}`;
    const word=document.createElement('div');word.className='toc-word';word.textContent=w.word;
    word.style.color=w.acc||'#E8EDF5';
    const meaning=document.createElement('div');meaning.className='toc-meaning';meaning.textContent=w.meaning;
    const tag=document.createElement('div');tag.className='toc-tag-sm';tag.textContent=w.tag;
    item.appendChild(day);item.appendChild(word);item.appendChild(meaning);item.appendChild(tag);
    item.addEventListener('click',()=>openCard(w.day-1));
    grid.appendChild(item);
  });
  updateMascot();
}

/* ── Card ── */
let cur=0,exOpen=false,anim=null;
function openCard(idx){
  cur=idx; exOpen=false;
  document.getElementById('page-toc').classList.add('hidden');
  document.getElementById('page-card').classList.remove('hidden');
  document.getElementById('ex-panel').classList.remove('show');
  document.getElementById('card-main').classList.remove('ex-open');
  renderCard();
}
function renderCard(dir){
  const w=WORDS[cur];
  if(dir&&anim){clearTimeout(anim);}
  const main=document.getElementById('card-main');
  if(dir){
    const cl=document.getElementById('card-content');
    cl.style.animation=`${dir==='r'?'fxR':'fxL'} .38s ease forwards`;
    anim=setTimeout(()=>{cl.style.animation='';},400);
  }
  document.getElementById('card-day').textContent=`DAY ${String(w.day).padStart(2,'0')}`;
  document.getElementById('card-day').style.borderColor=w.acc||'#C8102E';
  document.getElementById('card-day').style.color=w.acc||'#C8102E';
  document.getElementById('card-cat').textContent=w.tag;
  document.getElementById('card-word').textContent=w.word;
  document.getElementById('card-word').style.color=w.gold?w.acc:'#E8EDF5';
  document.getElementById('card-word').style.textShadow=w.gold?`0 0 40px ${w.acc}80`:'none';
  document.getElementById('card-pinyin').textContent=w.pinyin;
  document.getElementById('card-pron').textContent=w.pron;
  document.getElementById('card-line').style.background=w.acc||'#C8102E';
  document.getElementById('card-meaning').textContent=w.meaning;
  document.getElementById('card-emoji').textContent=EMOJIS[cur%EMOJIS.length];
  document.getElementById('card-scene').style.backgroundImage=mkBg(w);
  document.getElementById('ex-zh').textContent=w.ex_zh;
  document.getElementById('ex-kana').textContent=w.ex_kana||'';
  document.getElementById('ex-jp').textContent=w.ex_jp;
  document.getElementById('ex-naze').textContent=w.naze;
  document.getElementById('ex-x').textContent=w.x;
  const learned=getLearnedSet();
  const lb=document.getElementById('learned-btn');
  lb.className='learned-btn'+(learned.has(w.day)?' done':'');
  lb.textContent=learned.has(w.day)?'★ 習得済み':'✓ 覚えた';
  document.getElementById('card-counter').textContent=`${String(cur+1).padStart(2,'0')} / ${String(WORDS.length).padStart(2,'0')}`;
  document.getElementById('progress-fill').style.width=((cur+1)/WORDS.length*100)+'%';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===WORDS.length-1;
  exOpen=false;
  document.getElementById('ex-panel').classList.remove('show');
  main.classList.remove('ex-open');
}

/* nav */
document.getElementById('prev-btn').addEventListener('click',()=>{if(cur>0){cur--;renderCard('l');}});
document.getElementById('next-btn').addEventListener('click',()=>{if(cur<WORDS.length-1){cur++;renderCard('r');}});
document.getElementById('back-btn').addEventListener('click',()=>{
  document.getElementById('page-card').classList.add('hidden');
  document.getElementById('page-toc').classList.remove('hidden');
  buildToc();
});

/* swipe */
let tx=0,ty=0;
document.getElementById('card-main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById('card-main').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx>ady&&adx>30){
    if(dx<0&&cur<WORDS.length-1){cur++;renderCard('r');}
    else if(dx>0&&cur>0){cur--;renderCard('l');}
  } else if(ady>adx){
    if(dy<-40&&!exOpen){exOpen=true;document.getElementById('ex-panel').classList.add('show');document.getElementById('card-main').classList.add('ex-open');}
    else if(dy>40&&exOpen){exOpen=false;document.getElementById('ex-panel').classList.remove('show');document.getElementById('card-main').classList.remove('ex-open');}
  } else if(adx<12&&ady<12){
    if(!exOpen){exOpen=true;document.getElementById('ex-panel').classList.add('show');document.getElementById('card-main').classList.add('ex-open');}
    else{exOpen=false;document.getElementById('ex-panel').classList.remove('show');document.getElementById('card-main').classList.remove('ex-open');}
  }
});

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&cur<WORDS.length-1){cur++;renderCard('r');}
  if(e.key==='ArrowLeft'&&cur>0){cur--;renderCard('l');}
  if(e.key===' '){if(!exOpen){exOpen=true;document.getElementById('ex-panel').classList.add('show');document.getElementById('card-main').classList.add('ex-open');}else{exOpen=false;document.getElementById('ex-panel').classList.remove('show');document.getElementById('card-main').classList.remove('ex-open');}e.preventDefault();}
  if(e.key==='Escape'){document.getElementById('page-card').classList.add('hidden');document.getElementById('page-toc').classList.remove('hidden');buildToc();}
});

/* learned */
document.getElementById('learned-btn').addEventListener('click',()=>{
  const s=getLearnedSet();const w=WORDS[cur];
  if(s.has(w.day)){s.delete(w.day);}else{s.add(w.day);}
  saveLearnedSet(s);
  const lb=document.getElementById('learned-btn');
  lb.className='learned-btn'+(s.has(w.day)?' done':'');
  lb.textContent=s.has(w.day)?'★ 習得済み':'✓ 覚えた';
  updateMascot();
});

/* speak */
function speakNow(){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(WORDS[cur].word);
    u.lang='zh-CN';u.rate=0.85;u.pitch=1.0;
    window.speechSynthesis.speak(u);
  },320);
}
document.getElementById('speak-btn').addEventListener('click',speakNow);
function speakEx(){
  if(!window.speechSynthesis)return;
  const btn=document.getElementById('ex-speak-btn');
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(WORDS[cur].ex_zh);
  u.lang='zh-CN';u.rate=0.80;u.pitch=1.0;
  u.onstart=()=>btn.classList.add('playing');
  u.onend=()=>btn.classList.remove('playing');
  u.onerror=()=>btn.classList.remove('playing');
  window.speechSynthesis.speak(u);
}
document.getElementById('ex-speak-btn').addEventListener('click',e=>{e.stopPropagation();speakEx();});
document.getElementById('ex-speak-btn').addEventListener('touchend',e=>e.stopPropagation());

/* ── Quiz ── */
let quizQueue=[],quizIdx=0,quizCorrect=0,quizRevealed=false;
document.getElementById('quiz-start-btn').addEventListener('click',startQuiz);
function startQuiz(){
  const s=getLearnedSet();
  quizQueue=WORDS.filter(w=>!s.has(w.day)).sort(()=>Math.random()-.5);
  if(quizQueue.length===0){quizQueue=[...WORDS].sort(()=>Math.random()-.5);}
  quizIdx=0;quizCorrect=0;quizRevealed=false;
  document.getElementById('quiz-result').classList.add('hidden');
  document.getElementById('quiz-main').style.display='';
  document.getElementById('quiz-overlay').classList.remove('hidden');
  showQuizCard();
}
function showQuizCard(){
  if(quizIdx>=quizQueue.length){endQuiz();return;}
  const w=quizQueue[quizIdx];
  quizRevealed=false;
  document.getElementById('quiz-word').textContent=w.word;
  document.getElementById('quiz-pinyin').textContent=w.pinyin;
  document.getElementById('quiz-reveal').classList.remove('show');
  document.getElementById('quiz-meaning').textContent=w.meaning;
  document.getElementById('quiz-bar').style.width=(quizIdx/quizQueue.length*100)+'%';
}
document.getElementById('quiz-overlay').addEventListener('click',e=>{
  if(!quizRevealed&&!['quiz-close','quiz-yes','quiz-no'].includes(e.target.id)){
    quizRevealed=true;
    document.getElementById('quiz-reveal').classList.add('show');
  }
});
document.getElementById('quiz-yes').addEventListener('click',e=>{
  e.stopPropagation();
  const s=getLearnedSet();s.add(quizQueue[quizIdx].day);saveLearnedSet(s);
  quizCorrect++;quizIdx++;showQuizCard();updateMascot();
});
document.getElementById('quiz-no').addEventListener('click',e=>{e.stopPropagation();quizIdx++;showQuizCard();});
document.getElementById('quiz-close').addEventListener('click',()=>{document.getElementById('quiz-overlay').classList.add('hidden');});
document.getElementById('quiz-result-btn').addEventListener('click',()=>{document.getElementById('quiz-overlay').classList.add('hidden');buildToc();});
function endQuiz(){
  document.getElementById('quiz-main').style.display='none';
  const r=document.getElementById('quiz-result');r.classList.remove('hidden');r.classList.add('show');
  const pct=Math.round(quizCorrect/quizQueue.length*100);
  document.getElementById('quiz-result-emoji').textContent=pct>=80?'🏆':pct>=50?'🚀':'💪';
  document.getElementById('quiz-result-title').textContent=`${quizCorrect} / ${quizQueue.length} 正解！`;
  document.getElementById('quiz-result-sub').textContent=`正答率 ${pct}%`;
}

/* ── Theme toggle ── */
const THEME_KEY_ZH='spaceZh_theme';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-toggle').textContent=t==='light'?'🌙':'☀️';
  localStorage.setItem(THEME_KEY_ZH,t);
}
applyTheme(localStorage.getItem(THEME_KEY_ZH)||'dark');
document.getElementById('theme-toggle').addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
});

/* ── Init ── */
buildToc();
</script>
